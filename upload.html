<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Thiệp Tình Bạn</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 20px auto;
        padding: 20px;
        background: #f0f2f5;
      }
      .box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #ff4757;
        margin-top: 0;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        font-size: 14px;
      }
      input,
      textarea,
      button {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
      }
      button {
        background: #ff4757;
        color: white;
        border: none;
        font-weight: bold;
        margin-top: 15px;
        cursor: pointer;
        font-size: 15px;
      }
      button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
      .hint {
        font-size: 12px;
        color: #777;
        margin-top: 4px;
      }
      .preview-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .thumb {
        position: relative;
        width: 70px;
        height: 70px;
      }
      .thumb img {
        width: 70px;
        height: 70px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #ddd;
      }
      .thumb .del {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        margin: 0;
        padding: 0;
        border-radius: 50%;
        font-size: 12px;
        line-height: 20px;
        background: #333;
      }
      #result {
        margin-top: 15px;
        padding: 12px;
        background: #eccc68;
        border-radius: 6px;
        display: none;
        word-break: break-all;
        font-size: 14px;
      }
      #copyBtn {
        background: #2f3542;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Tạo Thiệp Cá Nhân</h2>
      <form id="uploadForm">
        <label>Tên người gửi / Tên thiệp:</label>
        <input type="text" id="senderName" placeholder="Nhập tên..." required />

        <label>Lời chúc / Thông điệp:</label>
        <textarea
          id="message"
          rows="3"
          placeholder="Nhập lời chúc..."
          required
        ></textarea>

        <label>Chọn ảnh (tối đa 6 ảnh, có thể chọn từng ảnh một):</label>
        <input type="file" id="imageInput" accept="image/*" multiple />
        <div class="hint" id="countHint">Đã chọn 0/6 ảnh</div>

        <div class="preview-list" id="previewList"></div>

        <button type="submit" id="btnSubmit">Tạo Link Thiệp</button>
      </form>

      <div id="result">
        <strong>Link thiệp riêng của khách:</strong><br />
        <a id="cardLink" href="#" target="_blank" rel="noopener"></a>
        <div class="hint" id="lenInfo"></div>
        <button type="button" id="copyBtn">Sao chép link</button>
      </div>
    </div>

    <script>
      // ====== THÔNG TIN CLOUDINARY (preset phải để chế độ Unsigned) ======
      const CLOUD_NAME = "yx8ugl6f";
      const UPLOAD_PRESET = "Friendupload";
      const MAX_IMAGES = 6;

      let selectedFiles = [];
      const imageInput = document.getElementById("imageInput");
      const previewList = document.getElementById("previewList");
      const countHint = document.getElementById("countHint");

      function renderPreview() {
        previewList.innerHTML = "";
        selectedFiles.forEach((file, idx) => {
          const wrap = document.createElement("div");
          wrap.className = "thumb";

          const img = document.createElement("img");
          img.src = URL.createObjectURL(file);

          const del = document.createElement("button");
          del.type = "button";
          del.className = "del";
          del.textContent = "×";
          del.title = "Bỏ ảnh này";
          del.addEventListener("click", () => {
            selectedFiles.splice(idx, 1);
            renderPreview();
          });

          wrap.appendChild(img);
          wrap.appendChild(del);
          previewList.appendChild(wrap);
        });
        countHint.textContent = `Đã chọn ${selectedFiles.length}/${MAX_IMAGES} ảnh`;
      }

      // Mỗi lần chọn thêm ảnh sẽ cộng dồn vào danh sách
      imageInput.addEventListener("change", (e) => {
        const files = Array.from(e.target.files);
        for (const file of files) {
          if (selectedFiles.length >= MAX_IMAGES) {
            alert(`Chỉ được chọn tối đa ${MAX_IMAGES} ảnh.`);
            break;
          }
          selectedFiles.push(file);
        }
        imageInput.value = ""; // cho phép chọn tiếp
        renderPreview();
      });

      // Mã hóa UTF-8 -> base64url (ngắn gọn, an toàn trên URL)
      function encodePayload(obj) {
        const bytes = new TextEncoder().encode(JSON.stringify(obj));
        let bin = "";
        bytes.forEach((b) => (bin += String.fromCharCode(b)));
        return btoa(bin)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (selectedFiles.length === 0) {
            alert("Vui lòng chọn ít nhất 1 tấm ảnh!");
            return;
          }

          const btn = document.getElementById("btnSubmit");
          btn.disabled = true;

          const name = document.getElementById("senderName").value.trim();
          const msg = document.getElementById("message").value.trim();

          try {
            const imagePaths = [];

            for (let i = 0; i < selectedFiles.length; i++) {
              btn.innerText = `Đang tải ảnh ${i + 1}/${selectedFiles.length}...`;

              const formData = new FormData();
              formData.append("file", selectedFiles[i]);
              formData.append("upload_preset", UPLOAD_PRESET);

              const res = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                { method: "POST", body: formData },
              );
              const data = await res.json();

              if (!data.public_id) {
                const reason =
                  (data.error && data.error.message) || "không rõ nguyên nhân";
                throw new Error(`Ảnh ${i + 1} tải lỗi: ${reason}`);
              }

              // Chỉ lưu đường dẫn gọn: v<version>/<public_id>.<định dạng>
              imagePaths.push(
                `v${data.version}/${data.public_id}.${data.format}`,
              );
            }

            const payload = { n: name, m: msg, i: imagePaths };
            const encoded = encodePayload(payload);

            // Link trỏ về index.html cùng thư mục với upload.html
            const base = new URL("index.html", window.location.href).href;
            const finalUrl = `${base}?data=${encoded}`;

            const a = document.getElementById("cardLink");
            a.href = finalUrl;
            a.innerText = finalUrl;
            document.getElementById("lenInfo").textContent =
              `Độ dài link: ${finalUrl.length} ký tự (ghi vào chip NFC cần chip đủ dung lượng).`;
            document.getElementById("result").style.display = "block";
          } catch (err) {
            alert("Lỗi: " + err.message);
          } finally {
            btn.disabled = false;
            btn.innerText = "Tạo Link Thiệp";
          }
        });

      document.getElementById("copyBtn").addEventListener("click", async () => {
        const url = document.getElementById("cardLink").href;
        try {
          await navigator.clipboard.writeText(url);
          alert("Đã sao chép link!");
        } catch {
          prompt("Hãy sao chép link bên dưới:", url);
        }
      });
    </script>
  </body>
</html>
